name: Image

# Every pull request builds the container image and smoke-tests it, so a
# broken Dockerfile fails before it merges. Every push to master does the
# same, then publishes the image to GHCR for linux/amd64 and linux/arm64,
# tagged with the full commit SHA (see deploy/README.md).
on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  # A pull request cancels its own superseded builds. Each push to master
  # gets a group of its own, so every commit's image is published.
  group: image-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/stevemiketa/rubiks-tutor

jobs:
  image:
    name: Build, smoke-test and publish the image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Build the image for this runner
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: cubular:smoke
          cache-from: type=gha
      - name: Smoke-test it
        run: |
          docker run -d --name cubular -p 127.0.0.1:8080:8080 cubular:smoke
          for _ in $(seq 30); do curl -fsS http://127.0.0.1:8080/readyz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/healthz
          curl -fsS http://127.0.0.1:8080/readyz
          curl -fsS http://127.0.0.1:8080/ | grep '<div id="root">' > /dev/null
          # The server runs as the distroless nonroot user.
          test "$(docker top cubular -o pid,uid | awk 'NR == 2 { print $2 }')" = 65532
      - name: Show the server's logs
        if: always()
        run: docker logs cubular

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build for every platform, and publish from master
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
